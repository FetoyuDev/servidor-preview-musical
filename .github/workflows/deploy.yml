name: Deploy Prévias Pages

on:
  push:
    branches: ["main"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Processar, converter e limpar áudios
        run: |
          # 1. Substituir espaços por _ em arquivos e pastas recursivamente com segurança
          find . -depth -name "* *" | while IFS= read -r f; do
            dir=$(dirname "$f")
            newname=$(basename "$f" | tr ' ' '_')
            mv "$f" "$dir/$newname"
          done

          # 2. Procurar por áudios de forma segura (usando -print0) e converter com o FFmpeg
          find . -type f \( -name "*.wav" -o -name "*.flac" -o -name "*.ogg" -o -name "*.m4a" -o -name "*.aac" \) -print0 | while IFS= read -r -d '' file; do
            output="${file%.*}.mp3"
            echo "Convertendo: '$file' para '$output'"
            ffmpeg -i "$file" -codec:a libmp3lame -qscale:a 2 "$output" -y
            rm "$file"
          done

      - name: Configurar Git para Commit Automático
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --staged --quiet; then
            echo "Nenhuma alteração de áudio para commitar."
          else
            git commit -m "chore: converte áudios para mp3, limpa originais e remove espaços"
            git push
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Executar gerador de HTML
        run: python generator.py

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
