- name: Processar, converter e limpar áudios com Python
        run: |
          python3 -c '
          import os
          import subprocess

          for root, dirs, files in os.walk("."):
              for file in files:
                  if file.lower().endswith((".wav", ".flac", ".ogg", ".m4a", ".aac")):
                      full_path = os.path.join(root, file)
                      # Remove espaços do nome do arquivo
                      new_file = file.replace(" ", "_")
                      new_full_path = os.path.join(root, new_file)
                      
                      if full_path != new_full_path:
                          os.rename(full_path, new_full_path)
                          full_path = new_full_path

                      output_path = os.path.splitext(full_path)[0] + ".mp3"
                      
                      if full_path == output_path:
                          continue

                      print(f"Convertendo: {full_path} para {output_path}")
                      subprocess.run([
                          "ffmpeg", "-i", full_path, 
                          "-codec:a", "libmp3lame", "-qscale:a", "2", 
                          output_path, "-y"
                      ], check=True)
                      
                      os.remove(full_path)
          '
