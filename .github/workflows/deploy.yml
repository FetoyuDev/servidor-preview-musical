name: Deploy Audio Preview Site to GitHub Pages

on:
  push:
    branches: ["main"] # Altere para "master" se a sua branch principal for essa

permissions:
  contents: read
  pages: write
  id-token: write

# Permite apenas um deploy simultâneo, evitando conflitos
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Informa qual pasta do repositório deve ir para o ar (.) pega tudo
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
